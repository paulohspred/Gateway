name: Gateway CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality, unit, race and config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Canonical project state
        run: bash scripts/check-project-state-updated.sh
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          mkdir -p "$RUNNER_TEMP/gobin"
          GOBIN="$RUNNER_TEMP/gobin" go install honnef.co/go/tools/cmd/staticcheck@1285a6a5ec1e0ebb658f49e82b6c566a878cc3cb
          "$RUNNER_TEMP/gobin/staticcheck" ./...
      - name: Unit and integration tests
        run: go test ./... -shuffle=on -count=1 -coverprofile=coverage.out
      - name: Coverage threshold
        env:
          RC_GATEWAY_MIN_COVERAGE: '58.0'
        run: bash scripts/check-coverage.sh coverage.out
      - name: Race detector
        run: go test -race ./... -count=1
      - name: Build
        run: go build -trimpath ./cmd/rc-gateway
      - name: Validate production examples
        run: |
          ./rc-gateway --version
          for cfg in configs/*.json; do
            echo "checking $cfg"
            ./rc-gateway --check-config --config "$cfg"
          done
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Local CI script parity
        run: bash scripts/ci.sh

  stress:
    name: Stress and leak gate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: 1000 concurrent pairs and 1000 TCP churn cycles
        env:
          RC_GATEWAY_STRESS: '1'
          RC_GATEWAY_STRESS_PAIRS: '1000'
          RC_GATEWAY_CHURN_CYCLES: '1000'
        run: go test ./internal/bridge -run '^TestStress' -count=1 -timeout=12m

  soak:
    name: Impairment and mini-soak gate
    needs: stress
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Repeated impaired reconnect soak
        env:
          RC_GATEWAY_SOAK: '1'
          RC_GATEWAY_SOAK_SECONDS: '30'
        run: go test ./internal/bridge -run '^TestSoakImpairedReconnect$' -count=1 -timeout=2m

  release:
    name: Security, reproducibility and release
    needs: soak
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Install pinned supply-chain tools
        run: |
          mkdir -p "$RUNNER_TEMP/gobin"
          GOBIN="$RUNNER_TEMP/gobin" go install golang.org/x/vuln/cmd/govulncheck@8fcedea455d953a0f8470e1f41420bb6f2e72665
          GOBIN="$RUNNER_TEMP/gobin" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@07257d5b9cbd2a3d4338a880c0ca50081e1ac445
          echo "$RUNNER_TEMP/gobin" >> "$GITHUB_PATH"
      - name: Vulnerability scan
        run: |
          "$RUNNER_TEMP/gobin/govulncheck" ./...
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Installer archive security tests
        run: bash scripts/test-installer-security.sh
      - name: Reproducible release build
        run: |
          VERSION="ci-${GITHUB_SHA}"
          REQUIRE_SBOM=1 ARCHES="amd64 arm64" DIST_DIR="$PWD/dist-a" bash scripts/build-release.sh "$VERSION"
          REQUIRE_SBOM=1 ARCHES="amd64 arm64" DIST_DIR="$PWD/dist-b" bash scripts/build-release.sh "$VERSION"
          for arch in amd64 arm64; do
            a="dist-a/rc-gateway-umbrella_${VERSION}_linux_${arch}.tar.gz"
            b="dist-b/rc-gateway-umbrella_${VERSION}_linux_${arch}.tar.gz"
            cmp "$a" "$b"
            cmp "$a.sha256" "$b.sha256"
          done
      - name: Validate release archive and installer dry-run
        run: |
          VERSION="ci-${GITHUB_SHA}"
          archive="dist-a/rc-gateway-umbrella_${VERSION}_linux_amd64.tar.gz"
          bash scripts/install-release.sh --dry-run "$archive" "$archive.sha256" configs/gateway.example.json
          tar -tzf "$archive" | grep -q '/sbom.cdx.json$'
          tar -tzf "$archive" | grep -q '/systemd/rc-gateway-umbrella.service$'
          tar -tzf "$archive" | grep -q '/scripts/rollback-release.sh$'
          tar -tzf "$archive" | grep -q '/scripts/probe-usb-hid.sh$'
          tar -tzf "$archive" | grep -q '/docs/USB_HID_COMAP.md$'
          tar -tzf "$archive" | grep -q '/docs/RUNBOOK.md$'
          tar -tzf "$archive" | grep -q '/docs/COMPATIBILITY_MATRIX.md$'
          tar -tzf "$archive" | grep -q '/README.md$'
      - name: Upload release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc-gateway-${{ github.sha }}
          path: |
            dist-a/*.tar.gz
            dist-a/*.sha256
          if-no-files-found: error
          retention-days: 14
