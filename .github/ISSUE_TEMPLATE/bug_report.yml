name: Bug report
description: Report a reproducible non-security defect
title: "[bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Do not report vulnerabilities, credentials, private keys or sensitive production payloads here. See SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Gateway version / commit
      description: Output of rc-gateway --version when available.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Linux distribution, kernel and architecture.
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: Sanitized topology and configuration
      description: Describe field/consumer transports without secrets.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs / metrics
      description: Remove credentials, keys, production addresses if sensitive, and payloads that should not be public.
