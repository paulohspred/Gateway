name: Sync exact release tree

on:
  push:
    branches:
      - recovery/import-2770d2c

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frontend-contract
          fetch-depth: 0
      - name: Apply exact reproducibility and Rapid checksum patch
        env:
          EXPECTED_PARENT: 810aa846a9177e410fe0acb3ed05f878ca258bfb
          EXPECTED_TREE: 0663359cf27a356fd329195590dd43dbad997fba
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import base64,gzip,os,pathlib
          pathlib.Path('/tmp/release-fix.patch').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_B64'])))
          PY
          git apply --index /tmp/release-fix.patch
          tree="$(git write-tree)"
          echo "tree=$tree"
          test "$tree" = "$EXPECTED_TREE"
          git config user.name "paulohspred"
          git config user.email "100045106+paulohspred@users.noreply.github.com"
          git commit -m "fix(release): make archives reproducible and pin Rapid checksum"
          git push origin HEAD:feature/frontend-contract --force-with-lease="feature/frontend-contract:${EXPECTED_PARENT}"
