name: Sync exact release tree

on:
  push:
    branches:
      - recovery/import-2770d2c

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frontend-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Reproduce and publish exact VM tree
        env:
          EXPECTED_PARENT: fc9df4526f5545d3ff168f0f69eaa8407a355a6c
          EXPECTED_TREE: 23935277fc754e4c42fa2b2dd5e9dd7704ce823b
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import base64, gzip, pathlib
          payload = ""
          pathlib.Path('frontend/src/pages/SecurityPage.tsx').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          cd frontend
          npx --yes npm@10.9.8 install qrcode@1.5.4 --save --ignore-scripts --no-audit --no-fund
          npx --yes npm@10.9.8 install @types/qrcode@1.5.5 --save-dev --ignore-scripts --no-audit --no-fund
          cd ..
          git add frontend/package.json frontend/package-lock.json frontend/src/pages/SecurityPage.tsx
          tree="$(git write-tree)"
          echo "tree=$tree"
          test "$tree" = "$EXPECTED_TREE"
          git config user.name "paulohspred"
          git config user.email "100045106+paulohspred@users.noreply.github.com"
          git commit -m "fix(auth): add local QR enrollment for MFA"
          git push origin HEAD:feature/frontend-contract --force-with-lease="feature/frontend-contract:${EXPECTED_PARENT}"
