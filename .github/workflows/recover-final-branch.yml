name: Sync exact release tree

on:
  push:
    branches:
      - recovery/import-2770d2c

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frontend-contract
          fetch-depth: 0
      - name: Apply exact validated documentation patch
        env:
          EXPECTED_PARENT: d2e741a4d8e19cdd3da88857ceaefe23d611342c
          EXPECTED_TREE: c980696bd0e412d33f43f13edf15508021b9a917
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import os,base64,gzip,pathlib
          pathlib.Path('/tmp/evidence.patch').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_B64'])))
          PY
          git apply --index /tmp/evidence.patch
          tree="$(git write-tree)"
          echo "tree=$tree"
          test "$tree" = "$EXPECTED_TREE"
          git config user.name "paulohspred"
          git config user.email "100045106+paulohspred@users.noreply.github.com"
          git commit -m "docs: record 28 of 28 tes validation evidence"
          git push origin HEAD:feature/frontend-contract --force-with-lease="feature/frontend-contract:${EXPECTED_PARENT}"
