name: Sync exact release tree

on:
  push:
    branches:
      - recovery/import-2770d2c

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frontend-contract
          fetch-depth: 0
      - name: Apply exact canonical handoff patch
        env:
          EXPECTED_PARENT: e1ca27e5026382be2a8195279589f23593c84336
          EXPECTED_TREE: 5e94a6483c4938cd0a82f064d8fc300aca7b108b
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import base64,gzip,os,pathlib
          pathlib.Path('/tmp/handoff.patch').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_B64'])))
          PY
          git apply --index /tmp/handoff.patch
          tree="$(git write-tree)"
          echo "tree=$tree"
          test "$tree" = "$EXPECTED_TREE"
          git config user.name "paulohspred"
          git config user.email "100045106+paulohspred@users.noreply.github.com"
          git commit -m "docs: record reproducible release hardening"
          git push origin HEAD:feature/frontend-contract --force-with-lease="feature/frontend-contract:${EXPECTED_PARENT}"
