name: Recover final branch

on:
  push:
    branches:
      - recovery/import-2770d2c

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Restore exact Git commit
        env:
          BUNDLE_URL: https://drop.pensa.ar/f/8X_86lO7aSbMQ/rc-mfa-hotfix-fc9df45.bundle
          BUNDLE_SHA256: b554b423df8dec259810d841e78b6583cb102b5b4d889bccb7ddcf334d5d4641
          TARGET_SHA: fc9df4526f5545d3ff168f0f69eaa8407a355a6c
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL "$BUNDLE_URL" -o /tmp/final.bundle
          echo "$BUNDLE_SHA256  /tmp/final.bundle" | sha256sum -c -
          mkdir /tmp/recover && cd /tmp/recover
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch /tmp/final.bundle feature/frontend-contract:refs/remotes/bundle/final
          test "$(git rev-parse refs/remotes/bundle/final)" = "$TARGET_SHA"
          git fetch origin feature/frontend-contract
          remote_head="$(git rev-parse FETCH_HEAD)"
          for f in .github/workflows/ci.yml .github/workflows/codeql.yml .github/workflows/frontend-ci.yml; do
            test "$(git rev-parse FETCH_HEAD:$f)" = "$(git rev-parse refs/remotes/bundle/final:$f)"
          done
          git push origin refs/remotes/bundle/final:refs/heads/feature/frontend-contract \
            --force-with-lease="refs/heads/feature/frontend-contract:${remote_head}"
