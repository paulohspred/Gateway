name: Frontend CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Runtime versions
        run: |
          node --version
          npm --version
      - name: Install exact direct dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
